<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stt 받아쓰기</title>
<style>
@font-face{font-family:"Pretendard";font-weight:400;font-display:swap;src:url(/static/fonts/Pretendard-Regular.ttf) format("truetype")}
@font-face{font-family:"Pretendard";font-weight:500;font-display:swap;src:url(/static/fonts/Pretendard-Medium.ttf) format("truetype")}
@font-face{font-family:"Pretendard";font-weight:600;font-display:swap;src:url(/static/fonts/Pretendard-SemiBold.ttf) format("truetype")}
:root{
  /* 콘셉트 카드 docs/design/concept.md — 규칙에서 나온 값 */
  --shell:#16202E; --surf:#fff; --list:#E9EBEE; --bg:#F2F3F5;
  --ink:#1B2130; --ink2:#4D5565; --mute:#636975; --line:#E3E6EA; --line2:#D5D9DF; --lane:#E9EBEF; --lbw:132px;
  --main:#1B2130; --main-h:#000000; --main-t:#EDF0F5; --ok-d:#5CC08A;
  --proof:#C42F26; --live:#D98200; --live-t:#FFF4E0; --ok:#1B6F45; --warn-t:#FFF6E5; --err-t:#FDECEA;
  --f:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:6px; --float:0 1px 3px rgba(20,30,50,.10),0 4px 14px rgba(20,30,50,.08);
  /* 간격 — 관계 이름 */
  --gap-text:4px; --gap-chip:8px; --gap-part:12px; --gap-edge:28px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--f);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.job:focus-visible,.res:focus-visible,.segs button:focus-visible,.lb .nm:focus-visible,h1.title:focus-visible{outline-offset:-2px}
::selection{background:#D5DEEA}
svg{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 셸 ---------- */
header.top{height:52px;display:flex;align-items:center;gap:var(--gap-part);padding:0 20px;background:var(--shell);color:#fff;position:relative;z-index:3}
.brand{font-weight:600;font-size:16px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:6px}
.brand span{font-weight:400;opacity:.65}
.eng{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:13px;font-size:12px;color:#C9D1DC;background:rgba(255,255,255,.06);border:0;cursor:pointer}
.eng i{width:7px;height:7px;border-radius:50%;background:var(--ok-d)}
.eng.off{color:#FFD9A3}.eng.off i{background:var(--live)}
.conn{font-size:12px;color:#FFD9A3;display:none}.conn.on{display:inline}
header .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r);font-weight:500;font-size:13px;border:1px solid transparent;cursor:pointer;white-space:nowrap;background:none;transition:background .15s,border-color .15s}
.btn:disabled{opacity:.45;cursor:default}
.btn.fill{background:var(--main);color:#fff}.btn.fill:hover:not(:disabled){background:var(--main-h)}
.btn.fill-l{background:#fff;color:var(--ink)}.btn.fill-l:hover{background:#E9ECF1}
.btn.ghost-d{color:#fff;border-color:rgba(255,255,255,.3)}.btn.ghost-d:hover{background:rgba(255,255,255,.08)}
.btn.line{border-color:var(--line2);background:#fff;color:var(--ink)}.btn.line:hover:not(:disabled){background:#F6F7F9}
.btn.quiet{color:var(--ink2)}.btn.quiet:hover:not(:disabled){background:#EEF0F3}
.btn.danger{color:var(--proof)}.btn.danger:hover{background:var(--err-t)}
.btn.sm{height:28px;padding:0 8px;font-size:12.5px}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:var(--r);border:0;background:none;color:var(--ink2);cursor:pointer}
.icon-btn:hover{background:#EEF0F3;color:var(--ink)}
.lamp{width:8px;height:8px;border-radius:50%;background:var(--live);display:inline-block;flex:none}
.lamp.blink{animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.lamp.blink{animation:none}}

.wrap{display:grid;grid-template-columns:var(--listw,272px) 1fr;height:calc(100vh - 52px);position:relative}
/* 목록 폭 조절 (끌기 · ←/→ · 두 번 눌러 기본) */
.split{position:absolute;top:0;bottom:0;left:calc(var(--listw,272px) - 1px);width:8px;cursor:col-resize;z-index:2;touch-action:none}
.split::after{content:"";position:absolute;top:0;bottom:0;left:0;width:2px;background:transparent;transition:background .15s}
.split:hover::after,.split.drag::after,.split:focus-visible::after{background:var(--line2)}
.split:focus-visible{outline-offset:-2px}

/* ---------- 작업 목록 ---------- */
aside.jobs{background:var(--list);display:flex;flex-direction:column;min-height:0;overflow:hidden;border-right:1px solid #DCDFE4}
.search{position:relative;margin:16px 16px 12px}
.search svg{position:absolute;left:10px;top:9px;color:var(--mute)}
.search input{width:100%;height:32px;border:1px solid transparent;border-radius:var(--r);background:#fff;padding:0 32px;font:13px var(--f);color:var(--ink)}
.search input:focus{border-color:var(--main);outline:none;box-shadow:0 0 0 2px rgba(27,33,48,.28)}
.search .clear{position:absolute;right:4px;top:4px;width:24px;height:24px;display:none}
.search.has .clear{display:inline-grid}
.lh{display:flex;justify-content:space-between;align-items:baseline;margin:6px 20px 8px;font-size:12px;font-weight:600;color:var(--ink2)}
.lh span{font-weight:400;color:var(--mute)}
.jl{list-style:none;margin:0;padding:0 8px 16px;overflow:auto;flex:1;min-height:0}
.job{display:block;width:100%;text-align:left;padding:12px;border-radius:var(--r);margin-bottom:2px;cursor:pointer;border:0;background:none}
.job:hover{background:#E0E3E8}
.job.sel{background:#fff;box-shadow:inset 0 0 0 1px var(--line2)}
.mtape{position:relative;height:6px;background:#DADDE2;border-radius:1px;margin:8px 0 6px;overflow:hidden}
.mtape i{position:absolute;top:0;bottom:0}.mtape.none{background:none;border:1px dashed #BFC4CC;height:6px}.mtape i.un{opacity:.38}
.jt{font-weight:600;font-size:13px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jm{display:flex;justify-content:space-between;gap:var(--gap-chip);font-size:12px;color:var(--mute);margin-top:4px}
.jm .src{display:flex;align-items:center;gap:4px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jm .mm{display:flex;gap:var(--gap-chip);flex:none}
.tag{font-weight:600;font-size:11px;color:var(--ink2);border:1px solid #C3C8D0;border-radius:3px;padding:0 4px;line-height:15px;flex:none}
.st{display:flex;align-items:center;gap:var(--gap-chip);font-size:12px;color:var(--ink2);margin-top:6px}
.st .bar{width:56px;height:4px;background:#D6DAE0;border-radius:2px;overflow:hidden}.st .bar i{display:block;height:100%;background:var(--ok)}
.st svg{flex:none}.st.ok{color:var(--ok)}.st.mute{color:var(--ink2)}.st.live{color:#8F5600}.st.err{color:var(--proof)}.st .r{color:var(--proof)}
.st.run{color:var(--main)}
.res{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-radius:var(--r);cursor:pointer}
.res:hover{background:#E0E3E8}
.res .rt{font-size:12px;color:var(--mute);display:flex;gap:var(--gap-chip)}
.res .rx{font-size:13px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
mark{background:#FFE69A;color:inherit;border-radius:2px;padding:0 1px}
.lempty{padding:12px 20px;font-size:12.5px;color:var(--mute);line-height:1.6}

/* ---------- 본문 ---------- */
main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surf)}
.jhead{padding:16px var(--gap-edge) 12px;border-bottom:1px solid var(--line);flex:none}
.trow{display:flex;align-items:flex-start;gap:var(--gap-part)}
h1.title{font-weight:600;font-size:20px;line-height:1.3;margin:0;letter-spacing:-.01em;flex:0 1 auto;min-width:0;cursor:text;border-radius:4px;padding:1px 4px;margin-left:-4px}
h1.title:hover{background:#F4F5F7}
h1.title svg{width:15px;height:15px;margin-left:8px;vertical-align:-1px;color:var(--mute);opacity:0;transition:opacity .15s}.jhead:hover h1.title svg{opacity:.5}h1.title:hover svg,h1.title:focus-visible svg{opacity:1}
input.title-in{flex:1;font:600 20px/1.3 var(--f);border:1px solid var(--main);border-radius:4px;padding:0 4px;margin-left:-5px;color:var(--ink)}
.meta .num,.tab .num,.st .num{font-variant-numeric:normal}
.meta{display:flex;flex-wrap:wrap;gap:var(--gap-text) 16px;font-size:12.5px;color:var(--ink2);margin-top:4px}
.meta .r{color:var(--proof)}.meta .ok{color:var(--ok)}
.meta .tech{display:inline-flex;gap:var(--gap-chip);color:var(--mute);margin-left:auto}
.note{margin-top:12px;padding:8px 12px;border-radius:var(--r);font-size:13px;display:flex;gap:var(--gap-chip);align-items:flex-start;line-height:1.5}
.note.warn{background:var(--warn-t);color:#7A4A00}.note.err{background:var(--err-t);color:#8E231C}.note.live{background:var(--live-t);color:#7A4A00;align-items:center}
.note .acts{margin-left:auto;display:flex;gap:6px;flex:none}

/* 트랙 */
.tracks{margin-top:14px;position:relative;user-select:none}
.ln{display:grid;grid-template-columns:var(--lbw) 1fr;align-items:center;height:28px}
.lb{font-size:12.5px;font-weight:600;color:var(--c);display:flex;justify-content:space-between;align-items:center;padding-right:12px;min-width:0}
.lb .nm{border:0;background:none;padding:4px;min-height:24px;margin-left:-4px;border-radius:4px;font:inherit;color:inherit;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:88px;text-align:left}
.lb .nm:hover{background:#F1F2F5}
.lb .nm svg{opacity:0;margin-left:4px;vertical-align:-1px;transition:opacity .15s}.lb .nm:hover svg,.lb .nm:focus-visible svg,.tracks:hover .lb .nm svg{opacity:.6}.lb .nm:hover svg{opacity:1}
.lb{position:relative}
.spop{position:absolute;left:0;top:28px;z-index:6;width:280px;background:#fff;border:1px solid var(--line2);border-radius:8px;box-shadow:var(--float);padding:12px;color:var(--ink);font-weight:400}
.spop .fl{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:12px}
.spop input{display:block;width:100%;height:32px;margin-top:4px;border:1px solid var(--line2);border-radius:var(--r);padding:0 8px;font:13px var(--f);color:var(--ink)}
.spop input:focus{border-color:var(--main);outline:none;box-shadow:0 0 0 2px rgba(27,33,48,.28)}
.spop .mg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.spop .row{display:flex;align-items:center;justify-content:space-between}.spop small{color:var(--mute);font-size:12px}
.lb em{font-style:normal;font-weight:400;color:var(--mute);flex:none}

.tr{position:relative;height:16px;background:var(--lane);border-radius:2px;cursor:pointer}
.tr i{position:absolute;top:0;bottom:0;background:var(--c);border-radius:1px;min-width:2px}
.tr i.un{opacity:.38}
.tr .et{position:absolute;top:-5px;width:2px;height:5px;background:var(--proof);margin-left:-1px}
.tr.livelane i{background:var(--live)}
.ruler{margin-left:var(--lbw);position:relative;height:18px;font-size:11px;color:var(--mute)}
.ruler span{position:absolute;transform:translateX(-50%);top:4px;white-space:nowrap}.ruler span.t0{transform:none}.ruler span.tn{transform:translateX(-100%)}
.ov{position:absolute;top:0;bottom:18px;left:var(--lbw);right:0;pointer-events:none}
.view{position:absolute;top:-4px;bottom:-2px;border:1.5px solid var(--main);background:none;border-radius:3px;min-width:4px}
.head{position:absolute;top:-6px;bottom:-2px;width:2px;background:var(--ink);margin-left:-1px}
.legend{display:flex;justify-content:flex-end;gap:var(--gap-part);font-size:11px;color:var(--mute);margin-top:2px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend .sw{width:12px;height:8px;border-radius:1px;background:var(--c0,#0F7D73)}.legend .sw.un{opacity:.38}
.legend .tk{width:2px;height:8px;background:var(--proof)}.legend .bx{width:12px;height:8px;border:1.5px solid var(--main);border-radius:2px}
.stages{display:flex;align-items:center;gap:var(--gap-part);height:64px;margin-left:var(--lbw);padding:0 4px;color:var(--mute);font-size:13px}
.stages b{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.stages b.now{color:var(--main)}.stages b.done{color:var(--ink2)}
.stages b.now::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--main);animation:blink 1.2s ease-in-out infinite}
.stages .sep{width:24px;height:1px;background:var(--line2)}
.stages .el{margin-left:auto}
.bar2.solo{margin-top:14px}.bar2.solo .stages{margin-left:0;height:34px;padding:0;flex:1}.bar2.solo .stages .el{margin-left:16px}

/* 재생 줄 */
.bar2{display:flex;align-items:center;gap:var(--gap-chip);margin-top:12px}
.pb{width:34px;height:34px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;border:0;cursor:pointer}
.pb:hover:not(:disabled){background:var(--main-h)}.pb:disabled{background:var(--line);color:var(--mute);cursor:default}
.tm{font-size:13px;color:var(--ink2);margin-right:var(--gap-chip)}.tm b{color:var(--ink);font-weight:600}
.follow{display:inline-flex;align-items:center;gap:4px;min-height:24px;font-size:12.5px;color:var(--ink2);cursor:pointer}
.bar2 .sp{flex:1}
.btn.spd{min-width:48px;justify-content:center}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:34px;background:#fff;border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--float);padding:4px;min-width:200px;z-index:5;display:none}
.menu.open .pop{display:block}
.menu .pop a,.menu .pop button{display:flex;justify-content:space-between;gap:12px;width:100%;padding:8px 12px;border-radius:4px;color:var(--ink);text-decoration:none;font-size:13px;border:0;background:none;cursor:pointer;text-align:left}
.menu .pop a:hover,.menu .pop button:hover{background:#F2F4F6}
.menu .pop small{color:var(--mute)}
#moreMenu .pop button{flex-direction:column;align-items:flex-start;gap:2px}
.menu .pop button span{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
#moreMenu .pop small{padding-left:24px}
.menu .pop{min-width:220px}

/* 문장 표 */
.scroll{flex:1;overflow:auto;min-height:0;position:relative}
table.segs{width:100%;border-collapse:collapse}
.segs td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:baseline;font-size:15px;line-height:1.55}
.segs tr{cursor:pointer}
.segs tr:hover td{background:#F7F8FA}
.segs td.t{width:64px;padding-left:4px;font-size:12px;color:var(--ink2);white-space:nowrap}
/* 추정 표시 ≈ 는 시각 앞 고정 칸에 작게 — 숫자 열이 줄마다 같은 자리에서 시작 */
.segs .ap{display:inline-block;width:10px;font-size:11px;color:var(--mute)}
.segs td.t.est,.segs td.t.live{color:var(--mute)}
.segs td.w{width:1%;font-size:12.5px;font-weight:600;white-space:nowrap;padding-left:4px}
.segs td.w .wn{display:inline-block;max-width:120px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.tdot{display:none;width:8px;height:8px;border-radius:50%;margin-right:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.segs td.x{position:relative;padding-right:var(--gap-edge)}
.segs td.c{width:52px;text-align:center;padding:0 0 0 calc(var(--gap-edge) - 8px)}
.segs.nochk td.c{width:calc(var(--gap-edge) - 4px);padding:0}
.chk{width:28px;height:28px;border-radius:var(--r);border:0;background:none;color:#B4BAC4;cursor:pointer;display:inline-grid;place-items:center;vertical-align:middle}
.chk:hover{background:#EEF0F3;color:var(--ink2)}
.chk.on{color:var(--ok)}
.segs tr.now td{background:var(--main-t)}
.segs tr.now td.t{color:var(--ink);font-weight:600}
.segs tr.now td:first-child{box-shadow:inset 3px 0 var(--main)}
.segs tr.hit td{background:#FFF7D6}
.segs tr.redo td.x{color:var(--mute)}
del{color:var(--proof);text-decoration-thickness:1.5px}
ins{color:var(--proof);text-decoration:none;font-weight:600}
.racts{position:absolute;right:8px;top:2px;display:none;gap:2px;padding:2px;background:#fff;border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--float)}
.segs tr:hover .racts,.segs tr:focus-within .racts{display:flex}
.segs tr.now .racts{display:flex;position:static;margin:6px 0 0 -8px;padding:0;border:0;box-shadow:none;background:none;flex-wrap:wrap}
.segs tr.now .racts button{height:28px;color:var(--ink)}
.segs tr.now .racts button:hover{background:#DFE4EC}
.racts button{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border:0;background:none;border-radius:4px;font-size:12px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.racts button:hover{background:#F1F3F5;color:var(--ink)}
.ed textarea{width:100%;min-height:56px;font:15px/1.55 var(--f);border:1px solid var(--main);border-radius:var(--r);padding:6px 8px;resize:vertical;color:var(--ink)}
.ed .row{display:flex;gap:6px;margin-top:6px;align-items:center}
.ed .row small{color:var(--mute);margin-left:auto}
.orig{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #C9CED6;border-top-color:var(--main);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.tempty{padding:48px var(--gap-edge);color:var(--ink2);font-size:13px;line-height:1.7;max-width:640px}
.tempty h2{font-size:16px;font-weight:600;margin:0 0 6px;color:var(--ink)}
.tbar{display:flex;align-items:center;gap:var(--gap-chip);padding:0 var(--gap-edge);border-bottom:1px solid var(--line);flex:none;height:40px}
.tabs{display:flex;gap:4px;height:100%}
.tab{display:inline-flex;align-items:center;gap:6px;height:100%;padding:0 8px;border:0;background:none;font-size:13px;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab .num{font-size:12px;color:var(--mute)}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--main)}
.tbar .sp{flex:1}
kbd.inv{color:#fff;border-color:rgba(255,255,255,.45)}
a.btn{text-decoration:none}
.btn.follow[aria-pressed=true]{color:var(--ink)}.btn.follow svg{margin-right:2px}
kbd{font:500 11px var(--f);color:var(--ink2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;margin-left:6px;line-height:16px}
.segs tr.flash td{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:#FFE69A}100%{background:transparent}}
.skel td{color:transparent}.skel td span{display:block;height:12px;border-radius:3px;background:#EEF0F3}

/* 첫 사용 */
.first{margin:auto;max-width:560px;padding:40px;text-align:left}
.first h2{font-size:20px;font-weight:600;margin:0 0 8px}
.first p{color:var(--ink2);line-height:1.7;margin:0 0 16px}
.drop{border:1.5px dashed #BAC1CB;border-radius:10px;padding:28px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;color:var(--ink2);background:#FAFBFC}
.drop.over{border-color:var(--main);background:var(--main-t)}
.drop .ways{display:flex;gap:var(--gap-chip)}
.first ul{margin:16px 0 0;padding-left:18px;color:var(--ink2);font-size:13px;line-height:1.8}

/* 대화창 */
dialog{border:0;border-radius:10px;padding:0;box-shadow:0 12px 40px rgba(20,30,50,.25);width:min(520px,calc(100vw - 32px));color:var(--ink)}
dialog::backdrop{background:rgba(22,32,46,.45)}
.dh{padding:16px 24px 4px;font-weight:600;font-size:16px}
.db{padding:8px 24px 4px}
.df{padding:12px 24px 16px;display:flex;justify-content:flex-end;gap:8px}
.field{margin-bottom:16px}
.field>label,.field>.lab{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.field input[type=text],.field input[type=url],.field select,.field textarea{width:100%;height:36px;border:1px solid var(--line2);border-radius:var(--r);padding:0 12px;font:13px var(--f);color:var(--ink);background:#fff}
.field textarea{height:64px;padding:8px 12px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--main);outline:none;box-shadow:0 0 0 2px rgba(27,33,48,.28)}
.field .help{font-size:12px;color:var(--mute);margin-top:4px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.seg label{display:inline-flex;align-items:center;gap:6px;padding:0 12px;height:32px;font-size:13px;cursor:pointer;border-right:1px solid var(--line2)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--main-t);color:var(--main);font-weight:600}
.seg label:has(input:focus-visible){outline:2px solid var(--main);outline-offset:-2px}
.files{font-size:12.5px;color:var(--ink2);margin-top:8px;display:flex;flex-direction:column;gap:2px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.derr{color:var(--proof);font-size:12.5px;margin:0 24px}
.lvlw{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.bar2.live{min-height:34px}.bar2.live b{font-weight:600;color:#8F5600}.bar2 .hint{font-size:12px;color:var(--mute)}.el2{font-size:13px;color:var(--ink2)}
.ltail{display:flex;align-items:center;gap:var(--gap-chip);padding:12px var(--gap-edge);font-size:12.5px;color:#8F5600}
.level{height:6px;background:var(--lane);border-radius:3px;overflow:hidden;width:120px}.level i{display:block;height:100%;background:var(--live);width:0;transition:width .08s}

#toast{position:fixed;left:calc(var(--listw,272px) + 16px);bottom:16px;background:var(--shell);color:#fff;padding:9px 14px;border-radius:var(--r);font-size:13px;box-shadow:var(--float);opacity:0;transform:translateY(6px);transition:all .2s;pointer-events:none;z-index:20}
#toast.on{opacity:1;transform:none}
#toast.err{background:#8E231C}

@media (max-width:900px){
  :root{--lbw:96px;--gap-edge:16px}
  .wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:calc(100vh - 52px)}
  aside.jobs{max-height:34vh;border-right:0;border-bottom:1px solid #DCDFE4}
  main{min-height:70vh}
  .bar2{flex-wrap:wrap;row-gap:8px}
  .segs td.w .wn{max-width:84px}
  .split{display:none}
  #toast{left:16px}
  header.top{padding:0 12px;gap:8px}
  header .btn span.lbl,.eng span{display:none}
}
@media (max-width:600px){
  .segs td.w{display:none}
  .tdot{display:inline-block}
  .segs td.t{width:64px}
  .follow,.spd{display:none}
  .lb em{display:none}
}

/* ===== 다듬기 시안 ===== */
.brand{align-items:center;gap:8px}.brand .logo{margin-right:2px}
.jhead{padding:20px var(--gap-edge) 14px;background:linear-gradient(#fff,#fff)}
h1.title{font-size:22px;letter-spacing:-.02em;font-weight:600}
.meta{margin-top:6px;color:var(--mute)}.meta>span:not(.tech):not(.r){color:var(--ink2)}
/* 데크: 트랙을 담는 판 */
.tracks{margin:16px calc(-1 * var(--gap-edge)) 0;padding:12px var(--gap-edge) 6px;background:#F6F7F9;border-top:1px solid #EDEFF2;border-bottom:1px solid #EDEFF2}
.ln{height:30px}
.tr{height:18px;background:#fff;border-radius:4px;box-shadow:inset 0 0 0 1px #E6E9EE;overflow:visible}
.tr::before{content:"";position:absolute;inset:0;border-radius:4px;background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(var(--grid) - 1px),#EEF0F4 calc(var(--grid) - 1px),#EEF0F4 var(--grid));pointer-events:none}
.tr i{top:2px;bottom:2px;border-radius:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.tr i.un{opacity:1;background:repeating-linear-gradient(135deg,var(--c) 0 2px,color-mix(in srgb,var(--c) 28%,#fff) 2px 6px) fixed}
.tr .et{top:-4px;width:6px;height:6px;border-radius:50%;margin-left:-3px;box-shadow:0 0 0 2px #F6F7F9}
.lb{font-size:13px}.lb .nm{display:inline-flex;align-items:center;gap:8px}
.lb .nm::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--c)}
.lb em{font-size:12px}
.ruler{height:20px}.ruler span{top:5px;color:#8A909A}
.ov{top:12px;bottom:26px}
.view{border:1px solid rgba(27,33,48,.45);background:rgba(27,33,48,.035);border-radius:6px;top:-5px;bottom:-3px}
/* 시그니처: 테이프 헤드 */
.head{width:1.5px;background:#1B2130;top:-14px;bottom:-4px}
.head::before{content:attr(data-t);position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:#1B2130;color:#fff;font:600 10.5px/16px var(--f);font-variant-numeric:tabular-nums;padding:0 6px;border-radius:8px;white-space:nowrap}
.head::after{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:#1B2130}
.legend{margin-top:6px}.legend .sw.un{opacity:1;background:repeating-linear-gradient(135deg,var(--c0) 0 2px,color-mix(in srgb,var(--c0) 28%,#fff) 2px 6px)}
.legend .tk{width:6px;height:6px;border-radius:50%}
.legend .bx{border:1px solid rgba(27,33,48,.45);border-radius:3px}
/* 재생 줄: 카운터 */
.bar2{margin-top:14px}
.tm{font-size:13px}.tm b{font-size:20px;letter-spacing:-.01em;margin-right:2px}
.pb{width:38px;height:38px;box-shadow:0 1px 2px rgba(0,0,0,.15)}
/* 표 */
.tbar{height:44px}
.segs td{border-bottom-color:#EFF1F4;padding-top:10px;padding-bottom:10px}
.segs td.x{line-height:1.6}
.dot{width:4px;height:14px;border-radius:2px;vertical-align:-2px;margin-right:8px}
.segs tr.now td{background:#F3F5F9}
.segs tr.now td:first-child{box-shadow:inset 2px 0 var(--main)}
.chk{color:#C4C9D1}
/* 목록 */
.job{border-radius:8px}
.job.sel{box-shadow:0 1px 2px rgba(20,30,50,.06),inset 0 0 0 1px #DADEE4}
.mtape{height:8px;border-radius:2px;background:#fff;box-shadow:inset 0 0 0 1px #DADEE4}
.mtape i{top:1px;bottom:1px;border-radius:1px}
.mtape i.un{opacity:.32}

/* ===== 프레임 시안: 세로 콘솔 + 떠 있는 작업면 ===== */
body{background:#E4E7EC}
.wrap{grid-template-columns:288px 1fr;height:100vh}
aside.jobs{background:#141C28;color:#E7EBF1;border-right:0;padding-top:4px}
.console-top{display:grid;grid-template-columns:1fr auto;align-items:center;row-gap:14px;padding:18px 18px 6px}
.console-top .brand{font-size:17px;color:#fff}.console-top .brand span{color:#8B96A6;opacity:1}
.console-top .eng{grid-column:2;grid-row:1;background:none;padding:0;color:#8B96A6;height:auto}
.console-top .eng span{display:none}
.console-top .conn{grid-column:1/-1}
.console-top #bUp,.console-top #bLive{grid-column:1/-1;justify-content:center;height:36px;border-radius:8px}
.console-top #bUp{order:3;background:#fff;color:#141C28}
.console-top #bLive{order:4;margin-top:-6px;color:#DDE3EA;border-color:#2E3A4B;background:#1A2432}
.console-top #bLive:hover{background:#212C3C}
.search{margin:14px 16px 8px}
.search input{background:#1D2735;color:#E7EBF1;border-color:#263243}
.search input::placeholder{color:#7D8899}.search svg{color:#7D8899}
.lh{color:#8B96A6;margin:14px 22px 8px;font-weight:500;letter-spacing:.01em}.lh span{color:#5F6B7C}
.jl{padding:0 10px 16px}
.job{border-radius:10px;padding:12px 12px 13px}
.job:hover{background:#1B2431}
.job.sel{background:#212C3B;box-shadow:inset 0 0 0 1px #2F3C4F}
.jt{color:#EEF1F5;font-weight:500}
.jm{color:#7D8899}.jm .tag{color:#B7C0CC;border-color:#3A4658}
.st{color:#AAB4C1}.st.ok{color:#6FCF97}.st.mute{color:#7D8899}.st.live{color:#F2B046}.st.run{color:#AAB4C1}.st .r{color:#F28B82}
.mtape{background:#232E3D;box-shadow:none}.mtape.none{border-color:#3A4658}
.mtape i.un{opacity:.35}
.lempty{color:#7D8899}
.res .rt{color:#7D8899}.res .rx{color:#DDE3EA}.res:hover{background:#1B2431}
/* 떠 있는 작업면 */
main{margin:12px 12px 12px 0;border-radius:16px;box-shadow:0 1px 2px rgba(20,28,40,.06),0 8px 28px rgba(20,28,40,.08);overflow:hidden}
.jhead{padding:26px 40px 16px;border-bottom:0}
.trow,.meta{max-width:1040px}
/* 계기판: 안쪽 패널 */
.tracks{--lbw:148px;margin:18px 0 0;padding:16px 18px 8px;border:0;border-radius:14px;background:#F4F6F9}
.legend{margin:8px 2px 0}
.tracks .lb{padding-right:20px}
.bar2{margin-top:16px}
/* 읽는 열: 가운데 모은 본문 */
.tbar{padding:0 max(40px, calc((100% - 960px) / 2));border-bottom:1px solid #EEF0F3}
.scroll{padding:0 40px}
table.segs{max-width:960px;margin:0 auto}
.segs td.c{padding-left:0}
.segs tr.now td{background:#F4F6F9}
.segs tr.now td:first-child{box-shadow:none;border-radius:10px 0 0 10px}
.segs tr.now td:last-child{border-radius:0 10px 10px 0}
.segs tr.now td{border-bottom-color:transparent}
#toast{left:300px}
</style>
</head>
<body>

<div class="wrap">

  <button class="btn ghost-d" id="bLive" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span class="lbl">실시간 받아 적기</span></button>

</div>
    <div class="search" id="searchBox">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>

  if (changed) { au.pause(); lastNow = -2; if (S.job.status !== "live" && S.job.duration) au.src = `/api/jobs/${jid}/audio`; else au.removeAttribute("src"); au.currentTime = 0; }
  renderList(); renderMain(false);
  if (S.hit && S.hit.jid === jid) {
    const s = S.job.segments.find(x => x.idx === S.hit.idx);
    if (s) { au.currentTime = s.start; tick(); $(`.segs tr[data-idx="${s.idx}"]`)?.scrollIntoView({block: "center"}); }
  } else $("#scroll")?.scrollTo(0, 0);
}
async function refresh(jid) {
  if (!S.job || S.job.id !== jid) return;
  const wasLive = S.job.status === "live", hadAudio = !!au.getAttribute("src");
  S.job = await api(`/api/jobs/${jid}`);
  const i = S.jobs.findIndex(x => x.id === jid); if (i >= 0) S.jobs[i] = {...S.jobs[i], ...S.job};
  if (S.job.status !== "live" && S.job.duration && (!hadAudio || wasLive)) { au.src = `/api/jobs/${jid}/audio`; }
  if (S.editing != null || S.renamingSpk != null || S.renamingTitle) { renderList(); return; }   // 입력 중에는 본문을 다시 그리지 않는다
  const sc = $("#scroll"); const atBottom = sc && sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 30;
  renderList(); renderMain();
  if (S.job.status === "live" && atBottom) { const s = $("#scroll"); s.scrollTop = s.scrollHeight; }
}
async function loadStatus(fresh = false) {
  try { S.status = await api(`/api/status${fresh ? "?fresh=1" : ""}`); } catch { return; }
  const e = $("#eng"), ok = S.status.ok;
  e.className = "eng" + (ok ? "" : " off");
  e.querySelector("span").textContent = ok ? "받아 적기 준비됨" : "엔진 꺼짐 — 이유 보기";
  e.title = ok ? `${S.status.asr.join(", ")}${S.status.diarizer ? " + 화자 분리 " + S.status.diarizer : ""} — 누르면 자세히` : S.status.hint;
}
$("#eng").addEventListener("click", async () => {
  await loadStatus(true);
  const st = S.status; if (!st) return;
  const lines = st.selection.map(t => `<li><b>${esc(t.engine)}</b>${t.role ? " (화자 분리)" : ""} — ${t.why_not ? esc(t.why_not) : "쓸 수 있음"}</li>`).join("");
  confirmBox(st.ok ? "엔진 상태" : "엔진 꺼짐", `${st.ok ? "" : `<p>${esc(st.hint)}</p>`}<ul style="padding-left:18px;margin:6px 0">${lines}</ul><p style="font-size:12.5px">정확도 순서로 조건(언어·모델·환경·GPU 여유)을 통과한 첫 엔진을 씁니다.</p>`, "닫기", true);
});
function connectEvents() {
  const es = new EventSource("/api/events");
  es.onopen = () => $("#conn").classList.remove("on");
  es.onerror = () => $("#conn").classList.add("on");
  es.onmessage = async ev => {
    const d = JSON.parse(ev.data);
    if (d.v === S.version) return; S.version = d.v;
    try {
      S.jobs = await api("/api/jobs");
      if (S.sel && !S.jobs.some(j => j.id === S.sel)) { S.sel = null; S.job = null; renderList(); renderMain(); return; }
      if (!S.sel && S.jobs.length) return loadJobs();
      if (S.sel && (d.jobs.includes(S.sel) || !d.jobs.length)) await refresh(S.sel); else renderList();
    } catch {}
  };
}

/* ---------------- 검색 ---------------- */
let qT;
$("#q").addEventListener("input", e => {
  S.search = e.target.value.trim(); $("#searchBox").classList.toggle("has", !!e.target.value);
  clearTimeout(qT);
  qT = setTimeout(async () => { S.hits = S.search.length >= 2 ? await api(`/api/search?q=${encodeURIComponent(S.search)}`) : []; renderList(); }, 250);
});
$("#q").addEventListener("keydown", e => { if (e.key === "Escape") $("#qClear").click(); });
$("#qClear").addEventListener("click", () => { $("#q").value = ""; S.search = ""; S.hits = []; S.hit = null; $("#searchBox").classList.remove("has"); renderList(); if (S.job) renderMain(); $("#q").focus(); });

/* ---------------- 대화창 ---------------- */
function confirmBox(title, html, go, only = false) {
  const d = $("#dConfirm"); $("#dcH").textContent = title; $("#dcB").innerHTML = html; $("#dcGo").textContent = go;
  d.querySelector('[value="no"]').hidden = only; d.returnValue = "";
  d.showModal();
  return new Promise(res => d.addEventListener("close", () => res(d.returnValue === "yes"), {once: true}));
}
let upFiles = [];
function setFiles(fs) {
  upFiles = [...fs].filter(f => f.size > 0);
  $("#fileList").innerHTML = upFiles.map(f => `<span>${esc(f.name)} <span class="num" style="color:var(--mute)">${(f.size / 1048576).toFixed(1)}MB</span></span>`).join("");
  $("#upGo").disabled = !upFiles.length; $("#upErr").textContent = fs.length && !upFiles.length ? "빈 파일입니다" : "";
}
function openUp(files) { setFiles(files || []); $("#dUp").showModal(); }
$("#bUp").addEventListener("click", () => openUp());
$("#fileIn").addEventListener("change", e => setFiles(e.target.files));
$("#upGo").addEventListener("click", async () => {
  const fd = new FormData(); upFiles.forEach(f => fd.append("files", f));
  fd.append("lang", $("#uLang").value); fd.append("context", $("#uCtx").value); fd.append("num_speakers", $("#uSpk").value); fd.append("speakers", $("#uDia").checked ? "1" : "0");
  const b = $("#upGo"); b.disabled = true; b.textContent = "올리는 중…";
  try {
    const jobs = await api("/api/jobs", {method: "POST", body: fd});
    $("#dUp").close(); $("#fileIn").value = ""; $("#uCtx").value = "";
    toast(`${jobs.length}개를 줄에 넣었습니다`);
    S.jobs = await api("/api/jobs"); await select(jobs[0].id);
  } catch (err) { $("#upErr").textContent = err.message; }
  finally { b.textContent = "받아 적기 시작"; b.disabled = !upFiles.length; }
});
for (const z of ["drop2"]) {
  const el = $("#" + z);
  el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("over"); });
  el.addEventListener("dragleave", () => el.classList.remove("over"));
  el.addEventListener("drop", e => { e.preventDefault(); el.classList.remove("over"); setFiles(e.dataTransfer.files); });
}
document.addEventListener("dragover", e => { if (e.dataTransfer?.types?.includes("Files")) { e.preventDefault(); $("#drop1")?.classList.add("over"); } });
document.addEventListener("dragleave", e => { if (!e.relatedTarget) $("#drop1")?.classList.remove("over"); });
document.addEventListener("drop", e => { if (!e.dataTransfer?.files?.length || $("#dUp").open) return; e.preventDefault(); $("#drop1")?.classList.remove("over"); openUp(e.dataTransfer.files); });

function openLive() { $("#liveErr").textContent = ""; $("#dLive").showModal(); }
$("#bLive").addEventListener("click", openLive);
$("#dLive").addEventListener("change", e => { if (e.target.name === "lsrc") $("#lUrlF").hidden = e.target.value !== "stream"; });
$("#liveGo").addEventListener("click", async () => {
  const source = $('input[name="lsrc"]:checked').value, b = $("#liveGo");
  b.disabled = true; $("#liveErr").textContent = "";
  let stream = null;
  try {
    if (source === "mic") {
      if (S.mic) throw new Error("이미 이 창에서 마이크로 듣고 있습니다");
      try { stream = await navigator.mediaDevices.getUserMedia({audio: {channelCount: 1, echoCancellation: true, noiseSuppression: true}}); }
      catch (err) { throw new Error(err.name === "NotAllowedError" ? "마이크 사용이 막혀 있습니다 — 주소창 왼쪽에서 마이크를 허용하세요" : "마이크를 찾지 못했습니다"); }
    }
    const job = await api("/api/live", J("POST", {source, url: $("#lUrl").value || null, lang: $("#lLang").value || null, context: $("#lCtx").value, title: $("#lTitle").value || null}));
    $("#dLive").close();
    if (stream) await startMic(job.id, stream);
    S.jobs = await api("/api/jobs"); await select(job.id);
  } catch (err) { stream?.getTracks().forEach(t => t.stop()); $("#liveErr").textContent = err.message; }
  finally { b.disabled = false; }
});

/* 마이크 → 16kHz PCM16 → WebSocket */
const WORKLET = `class P extends AudioWorkletProcessor{process(i){const c=i[0]&&i[0][0];if(c)this.port.postMessage(c.slice(0));return true}}registerProcessor("pcm",P)`;
async function startMic(jid, stream) {
  const ctx = new AudioContext({sampleRate: 16000});
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], {type: "text/javascript"})));
  const src = ctx.createMediaStreamSource(stream), node = new AudioWorkletNode(ctx, "pcm");
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/live/${jid}/ws`);
  ws.binaryType = "arraybuffer";
  let buf = [], n = 0;
  node.port.onmessage = ev => {
    const f = ev.data; let peak = 0;
    const pcm = new Int16Array(f.length);
    for (let i = 0; i < f.length; i++) { const v = Math.max(-1, Math.min(1, f[i])); pcm[i] = v * 32767; peak = Math.max(peak, Math.abs(v)); }
    buf.push(pcm); n += pcm.length;
    const lv = $("#lvl"); if (lv) lv.style.width = Math.min(100, peak * 140) + "%";
    if (n >= 1600 && ws.readyState === 1) { const out = new Int16Array(n); let o = 0; for (const b of buf) { out.set(b, o); o += b.length; } ws.send(out.buffer); buf = []; n = 0; }
  };
  src.connect(node);
  S.mic = {jid, ctx, stream, ws, node};
  ws.onclose = () => { if (S.mic && S.mic.jid === jid) cleanupMic(); };
}
function cleanupMic() {
  const m = S.mic; if (!m) return; S.mic = null;
  try { m.node.port.onmessage = null; m.ctx.close(); } catch {}
  m.stream.getTracks().forEach(t => t.stop());
}
async function stopMic(final) {
  const m = S.mic; if (!m) return;
  if (!final) await api(`/api/live/${m.jid}/stop?final=false`, {method: "POST"});
  if (m.ws.readyState === 1) m.ws.send("stop");
  cleanupMic();
}
window.addEventListener("beforeunload", e => { if (S.mic) { e.preventDefault(); e.returnValue = ""; } });

/* ---------------- 목록 폭 ---------------- */
const LISTW = {min: 220, max: 440, def: 272};
function setListW(w, save = true) {
  w = Math.round(Math.min(LISTW.max, Math.max(LISTW.min, w)));
  document.documentElement.style.setProperty("--listw", w + "px");
  const sp = $("#split"); sp.setAttribute("aria-valuenow", w); sp.setAttribute("aria-valuemin", LISTW.min); sp.setAttribute("aria-valuemax", LISTW.max);
  if (save) try { localStorage.setItem("stt.listw", w); } catch {}
  return w;
}
function afterListW() { if (S.job && S.editing == null && S.renamingSpk == null && !S.renamingTitle) renderMain(); }   // 트랙 눈금 간격을 새 폭으로
{
  let saved = null; try { saved = +localStorage.getItem("stt.listw"); } catch {}
  setListW(saved || LISTW.def, false);
  const sp = $("#split");
  sp.addEventListener("pointerdown", e => {
    e.preventDefault(); sp.setPointerCapture(e.pointerId); sp.classList.add("drag");
    const move = ev => setListW(ev.clientX, false);
    const up = ev => { sp.removeEventListener("pointermove", move); sp.classList.remove("drag"); setListW(ev.clientX); afterListW(); };
    sp.addEventListener("pointermove", move); sp.addEventListener("pointerup", up, {once: true});
  });
  sp.addEventListener("dblclick", () => { setListW(LISTW.def); afterListW(); });
  sp.addEventListener("keydown", e => {
    const cur = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--listw")) || LISTW.def;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); setListW(cur + (e.key === "ArrowLeft" ? -16 : 16)); afterListW(); }
    if (e.key === "Home" || e.key === "Enter") { e.preventDefault(); setListW(LISTW.def); afterListW(); }
  });
}

/* ---------------- 시작 ---------------- */
window.addEventListener("hashchange", () => { const want = new URLSearchParams(location.hash.slice(1)).get("job"); if (want && want !== S.sel) select(want); });
loadStatus(); setInterval(loadStatus, 30000);
loadJobs().then(connectEvents).catch(err => { $("#main").innerHTML = `<div class="tempty"><h2>서버에 연결하지 못했습니다</h2>${esc(err.message)} — <code>python -m stt serve</code> 가 켜져 있는지 확인하세요.</div>`; });
